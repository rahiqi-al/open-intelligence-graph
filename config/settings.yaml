project: open-intelligence-graph

ingestion:
  openalex:
    per_page: 100
    base_filter: "primary_topic.field.id:17,has_abstract:true,type:article|conference-paper|preprint"
  arxiv:
    page_size: 100

  # One query = one topic, split into yearly partitions.
  # max_per_window = maximum works fetched per source, per year.
  queries:
    - name: rag
      openalex_search: '"retrieval augmented generation"'
      arxiv_search: 'all:"retrieval augmented generation"'
      year_from: 2020
      max_per_window: 150
    - name: knowledge_graph
      openalex_search: '"knowledge graph"'
      arxiv_search: 'all:"knowledge graph"'
      year_from: 2018
      max_per_window: 150
    - name: llm
      openalex_search: '"large language model"'
      arxiv_search: 'all:"large language model"'
      year_from: 2019
      max_per_window: 150
    - name: graph_ml
      openalex_search: '"graph neural network"'
      arxiv_search: 'all:"graph neural network"'
      year_from: 2018
      max_per_window: 100
    - name: data_engineering
      openalex_search: '"data engineering"'
      arxiv_search: 'all:"data engineering"'
      year_from: 2018
      max_per_window: 100

chunking:
  max_tokens: 512
  overlap_tokens: 64

retrieval:
  vector_top_k: 20
  graph_top_k: 20
  rerank_top_k: 8
  max_graph_hops: 2
  
processing:
  min_title_chars: 8
  min_abstract_chars: 80
  year_min: 1990
  allowed_types: [article, conference-paper, preprint]
  allowed_languages: [en]
  max_reject_rate: 0.30

pdfs:
  max_per_run: 500
  workers: 6
  timeout_s: 60
  min_bytes: 10000
  max_bytes: 60000000
  max_pages: 120
  min_text_chars: 2000
  default_interval_s: 1.0
  host_interval_s:
    arxiv.org: 3.5
    export.arxiv.org: 3.5

chunker:
  chunk_tokens: 512
  overlap_tokens: 64
  tokens_per_word: 1.4
  min_chunk_words: 40
  min_alpha_ratio: 0.5
  skip_sections: [acknowledg]
